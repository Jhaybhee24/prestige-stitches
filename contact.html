<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - Prestige Stitches</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <div class="logo">PRESTIGE STITCHES</div>
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="gallery.html">Gallery</a>
      <a href="contact.html">Contact</a>
      <button class="theme-btn" onclick="toggleTheme()">Theme</button>
    </nav>
  </header>

  <div class="container">
    <div class="card">
      <h1>Book a Consultation</h1>
      <p>inquire on a wear or outfit.</p>

      <form id="contactForm" onsubmit="handleContactSubmit(event)">
        <label for="contactName">Full Name</label>
        <input type="text" id="contactName" placeholder="Enter your full name...">

        <label for="contactEmail">Email Address(Optional)</label>
        <input type="email" id="contactEmail" placeholder="Enter your email..."

          <label for="contactNo">Mobile No </label>
          <input type="contactnumber"="contactnumber" placeholder="Enter your number..."
        
        <label for="contactMsg">Message </label>
        <textarea id="contactMsg" rows="5" placeholder="Describe your preferred outfit style..."></textarea>

        <button type="submit" class="btn-primary">Send Inquiry</button>
      </form>

      <div id="contactStatus" style="margin-top: 15px; font-weight: bold;"></div>
    </div>
  </div>

  <footer>
    <p>&copy; 2026 Prestige Stitches. All rights reserved.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
